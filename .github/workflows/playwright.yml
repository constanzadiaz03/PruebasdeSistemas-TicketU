name: Playwright E2E Tests

on:
  push:
    branches: [main, entrega-3]
  pull_request:
    branches: [main, entrega-3]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: PS-E3/package-lock.json

      - name: Install dependencies
        working-directory: ./PS-E3
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./PS-E3
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ./PS-E3
        run: npm test
        env:
          BASE_URL: https://pruebasdesistemauv.com/ticketu
          API_BASE_URL: https://pruebasdesistemauv.com/ticketu/api

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: PS-E3/playwright-report/
          retention-days: 7

      - name: Upload test results (JSON/JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: PS-E3/test-results/
          retention-days: 7

      - name: Comment PR with test summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'PS-E3/test-results/results.json';
            if (fs.existsSync(path)) {
              const results = JSON.parse(fs.readFileSync(path, 'utf8'));
              const passed = results.suites.reduce((acc, suite) => acc + suite.specs.filter(s => s.ok).length, 0);
              const failed = results.suites.reduce((acc, suite) => acc + suite.specs.filter(s => !s.ok).length, 0);
              const total = passed + failed;

              const body = `## 🧪 Playwright E2E Test Results
              | Metric | Value |
              |--------|-------|
              | ✅ Passed | ${passed} |
              | ❌ Failed | ${failed} |
              | 📊 Total | ${total} |
              | 📈 Pass Rate | ${total > 0 ? ((passed/total)*100).toFixed(1) : 0}% |

              [View Full Report](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }